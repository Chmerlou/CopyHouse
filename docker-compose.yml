services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copyhouse
      POSTGRES_PASSWORD: copyhouse
      POSTGRES_DB: copyhouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copyhouse -d copyhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://copyhouse:copyhouse@postgres:5432/copyhouse
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
